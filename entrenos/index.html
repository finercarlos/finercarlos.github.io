<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Entrenos</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Entrenos">
<meta name="theme-color" content="#0b0d12">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
:root{
  --bg:#0b0d12; --card:#151924; --card2:#1c2130; --line:#272d3f; --txt:#eef1f7; --mut:#8b93a8;
  --acc:#ff6a2b; --acc2:#ffb648; --ok:#2fd27a; --bad:#ff4d6a; --info:#53a8ff;
  --hdr:rgba(11,13,18,.92); --nav:rgba(17,20,28,.96); --ph:#4a5166; --dash:#3a4157; --toast:#222838;
  --r:14px; --safe-b:env(safe-area-inset-bottom); --safe-t:env(safe-area-inset-top);
}
:root[data-theme=light]{--bg:#f3f4f7;--card:#ffffff;--card2:#eceef3;--line:#d6dae3;--txt:#11141b;--mut:#5b6377;--acc:#e8541a;--acc2:#b86a00;--ok:#13894b;--bad:#d42a48;--info:#1d6fd1;--hdr:rgba(243,244,247,.94);--nav:rgba(255,255,255,.97);--ph:#9aa1b2;--dash:#b9bfcc;--toast:#ffffff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{padding-top:var(--safe-t);padding-bottom:calc(76px + var(--safe-b));min-height:100vh;overscroll-behavior-y:none}
header{position:sticky;top:0;z-index:5;background:var(--hdr);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:12px 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
header h1{font-size:20px;margin:0;flex:1;letter-spacing:.2px}
header h1 small{display:block;font-size:12px;color:var(--mut);font-weight:500}
main{padding:14px 16px;max-width:680px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:var(--nav);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:10px 0 12px;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.muted{color:var(--mut)} .small{font-size:13px} .tiny{font-size:11px}
textarea{width:100%;min-height:240px;background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:var(--r);padding:12px;font:15px/1.4 inherit;font-family:inherit;resize:vertical}
input,select{font-family:inherit}
.btn{appearance:none;border:0;border-radius:12px;padding:13px 16px;font-size:16px;font-weight:700;background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn.pri{background:linear-gradient(135deg,var(--acc),#ff8a3d);border-color:transparent;color:#fff}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn:active{transform:scale(.98)}
.row{display:flex;gap:10px;align-items:center}
.row>.grow{flex:1}
.datebox{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.datebox input{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:15px;min-width:0}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--card2);color:var(--mut);border:1px solid var(--line)}
.pill.acc{color:var(--acc);border-color:rgba(255,106,43,.4);background:rgba(255,106,43,.1)}
.pill.ok{color:var(--ok);border-color:rgba(47,210,122,.4);background:rgba(47,210,122,.1)}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:var(--r);padding:16px;margin-bottom:10px}
.opt b{font-size:18px;display:block;margin-bottom:4px}
.opt:active{border-color:var(--acc)}
.check{display:flex;gap:10px;align-items:center;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px}
.check input{width:22px;height:22px;accent-color:var(--acc)}
h2{font-size:22px;margin:4px 0 12px}
h3{font-size:17px;margin:0 0 4px;color:var(--acc2)}
.part{margin-bottom:18px}
.parttxt{font-size:13px;color:var(--mut);margin:2px 0 10px;white-space:pre-line}
.parttxt.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.blk{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px 12px;margin-bottom:6px}
.blk.optional{border-style:dashed;opacity:.85}
.blkh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-weight:700;font-size:14px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.rep{display:flex;align-items:center;gap:8px;padding:6px 0}
.rep .lab{min-width:58px;font-weight:800;font-size:18px}
.rep .lab small{display:block;font-size:10px;color:var(--mut);font-weight:600;letter-spacing:.3px}
.rep input.t{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px 10px;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.gset{border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:10px;padding:10px 12px;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.gset small{display:block;font-size:10px;color:var(--mut);font-weight:600}
.gset.done{background:rgba(47,210,122,.12);border-color:var(--ok);color:var(--ok);text-decoration:line-through}
.gset.chg{color:var(--acc2);border-color:var(--acc2)}
.gset.done.chg{background:rgba(255,182,72,.12)}
.gset.skip{color:var(--bad);border-color:var(--bad);text-decoration:line-through;opacity:.8}
.rep input.t.kg{flex:0 0 72px;font-size:15px}
.rep input.t::placeholder{color:var(--ph);font-weight:500}
.rep.locked input.t{border-color:rgba(47,210,122,.6);background:rgba(47,210,122,.08);color:var(--ok)}
.rep.skipped input.t{border-color:rgba(255,77,106,.5);background:rgba(255,77,106,.07);color:var(--bad);text-decoration:line-through}
.rep.opt-rep .lab{opacity:.6}
.ib{width:42px;height:42px;flex:none;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--txt);display:flex;align-items:center;justify-content:center;font-size:18px;padding:0}
.ib svg{width:20px;height:20px}
.ib.mic.on{background:var(--bad);border-color:var(--bad);color:#fff}
.ib.lock{color:var(--ok)} .ib.skip{color:var(--bad)} .ib.del{color:var(--bad)}
.ib.on.skip{background:rgba(255,77,106,.18);border-color:var(--bad)}
.rest{font-size:11px;color:var(--mut);padding:0 0 0 66px;margin:-2px 0;display:flex;align-items:center;gap:6px}
.rest:before{content:"";width:14px;border-top:1px dashed var(--dash)}
.rest.big{padding:6px 0;justify-content:center;font-size:12px;color:var(--info)}
.rest.big:before,.rest.big:after{content:"";flex:1;border-top:1px dashed #2c3d5a;width:auto}
.meta{font-size:11px;color:var(--mut);min-width:0}
.pace.ok{color:var(--ok);font-weight:700}
.pace.bad{color:var(--bad);font-weight:700}
.pace{display:block;font-size:10px;color:var(--mut);text-align:right;padding-right:100px;margin-top:-4px}
.notes{margin:0 0 12px;padding:0;list-style:none}
.notes li{font-size:13px;color:var(--mut);background:rgba(83,168,255,.07);border-left:3px solid var(--info);border-radius:6px;padding:7px 10px;margin-bottom:6px}
.addrep{font-size:13px;color:var(--acc);background:none;border:0;padding:6px 0 0;font-weight:700}
.week{margin-bottom:20px}
.weekh{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 8px}
.weekh b{font-size:15px} .weekh span{font-size:12px;color:var(--mut)}
.wo{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;color:var(--txt)}
.wo .d{font-size:12px;color:var(--mut);font-weight:600;text-transform:capitalize}
.wo .g{font-size:16px;font-weight:800;margin:2px 0}
.wo .s{font-size:13px;color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:50px 20px}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl td{padding:5px 4px;border-bottom:1px solid var(--line)}
.tbl td.r{text-align:right}
.stat{display:flex;gap:8px;margin:8px 0 4px;flex-wrap:wrap}
.stat div{flex:1;min-width:80px;background:var(--card2);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-size:17px} .stat span{font-size:11px;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:var(--toast);border:1px solid var(--line);color:var(--txt);padding:10px 16px;border-radius:12px;font-weight:600;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--txt);padding:7px 12px;border-radius:20px;font-weight:700;font-size:14px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.rpe{display:flex;gap:4px}
.rpe button{flex:1;padding:9px 0;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-weight:700}
.rpe.need button{border-color:var(--bad)}
.rpe button.on{background:var(--acc);border-color:var(--acc)}
.field{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px;font-size:15px}
.editlab{width:64px;text-align:center;background:var(--bg);border:1px solid var(--acc);color:var(--txt);border-radius:8px;padding:8px 6px;font-weight:800;font-size:16px}
.spark{width:100%;height:70px;display:block;margin:6px 0}
.hdrbtn{background:none;border:0;color:var(--acc);font-weight:700;font-size:15px;padding:6px}
.sumbar{position:sticky;top:58px;z-index:4;background:var(--bg);padding:6px 0 8px;display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mut)}
.bar{flex:1;height:6px;background:var(--card2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--ok));width:0}
details summary{cursor:pointer;color:var(--mut);font-size:13px;margin-bottom:6px}
</style>
</head>
<body>
<header><h1 id="title">Entrenos</h1><div id="hdr"></div></header>
<main id="app"></main>
<nav>
  <button id="nav-new" data-nav="input"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Entreno</button>
  <button id="nav-hist" data-nav="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Historial</button>
  <button id="nav-prog" data-nav="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19l5-6 4 3 7-9"/><path d="M4 4v15h16"/></svg>Progreso</button>
  <button id="nav-calc" data-nav="calc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h2M12 11h0M16 11h0M8 15h2M12 15h0M16 15v3M8 18h2M12 18h0"/></svg>Calculadora</button>
</nav>
<div class="toast" id="toast"></div>
<input type="file" id="importfile" accept="application/json,.json" hidden>
<input type="file" id="photofile" accept="image/*" multiple hidden>
<script src="parser.js?v=11"></script>
<script src="gym-parser.js?v=11"></script>
<script src="app.js?v=11"></script>
</body>
</html>
